<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rust+ Control</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <div class="dashboard-layout">
      <div class="dashboard-primary">
        <header><div><p class="eyebrow">RUST+ COMPANION</p><h1>Electrical control</h1></div><div class="header-actions"><span id="connection" class="status">Loading</span><button type="button" class="secondary" id="edit-settings">Settings</button><button type="button" class="secondary" id="sign-out">Sign out</button></div></header>
        <section id="pairing" class="pairing" hidden><div class="row-title"><h2>Rust+ pairing</h2><span id="pairing-status" class="hint">Checking...</span></div><div class="pairing-actions"><button type="button" class="secondary" id="register-rustplus">Register Rust+</button><button type="button" class="secondary danger" id="logout-rustplus">Reset Rust+ pairing</button></div></section>
        <section class="server-bar"><label>Active server<select id="server-select"></select></label><p id="feedback" class="hint" role="status"></p></section>
        <section class="controls"><div class="row-title"><h2>Controls</h2><div class="notification-actions"><button id="import-devices" class="secondary" type="button">Import</button><button id="export-devices" class="secondary" type="button">Export</button><button id="create-group" class="secondary" type="button">New group</button></div></div><input id="import-devices-file" type="file" accept="application/json,.json" hidden><div id="control-list" class="control-list"></div></section>
      </div>
      <section class="notifications"><div class="row-title"><h2>Map events</h2><div class="notification-actions"><button type="button" class="secondary" id="configure-discord">Discord</button><button type="button" class="secondary" id="enable-notifications">Enable notifications</button></div></div><p id="notification-state" class="hint"></p><p id="discord-state" class="hint"></p><div id="event-list" class="event-list"></div></section>
    </div>
  </main>
  <dialog id="pairing-dialog"><form id="pairing-form" method="dialog"><h2>New Rust+ device</h2><p id="pairing-device-id" class="hint"></p><label>Name<input id="pairing-device-name" required></label><label>Type<select id="pairing-device-type"><option value="switch">Smart Switch</option><option value="alarm">Smart Alarm</option></select></label><div class="dialog-actions"><button type="button" class="secondary" id="reject-pairing">Cancel</button><button type="submit">Add device</button></div></form></dialog>
  <dialog id="device-dialog"><form id="device-form" method="dialog"><h2>Rename device</h2><label>Name<input id="device-name" maxlength="80" required></label><div class="dialog-actions"><button type="button" class="secondary" id="cancel-device-edit">Cancel</button><button id="save-device-name" type="submit">Save</button></div></form></dialog>
  <dialog id="group-dialog"><form id="group-form" method="dialog"><h2 id="group-dialog-title">New device group</h2><label>Name<input id="group-name" maxlength="80" required></label><fieldset id="group-members"><legend>Devices</legend></fieldset><div class="dialog-actions"><button type="button" class="secondary danger" id="delete-group" hidden>Delete</button><button type="button" class="secondary" id="cancel-group-edit">Cancel</button><button id="save-group" type="submit">Save</button></div></form></dialog>
  <dialog id="discord-dialog"><form id="discord-form" method="dialog"><h2>Discord alarms</h2><label>Webhook URL<input id="discord-webhook-url" type="url" inputmode="url" autocomplete="off" placeholder="https://discord.com/api/webhooks/..." aria-describedby="discord-webhook-hint"></label><p id="discord-webhook-hint" class="hint">Leave empty to disable Discord alarm notifications.</p><div class="dialog-actions"><button type="button" class="secondary" id="cancel-discord">Cancel</button><button id="save-discord" type="submit">Save</button></div></form></dialog>
  <dialog id="settings-dialog"><form id="settings-form" method="dialog"><h2>Server and FCM settings</h2><fieldset><legend>Rust+ server</legend><label>Name<input id="settings-server-name" maxlength="80" required></label><label>Host<input id="settings-server-host" maxlength="255" required></label><label>Port<input id="settings-server-port" inputmode="numeric" maxlength="5" required></label><label>Steam64 ID<input id="settings-player-id" inputmode="numeric" maxlength="32" required></label><label>Player token<input id="settings-player-token" type="password" required></label><label class="inline-check"><input id="settings-use-proxy" type="checkbox">Use Facepunch proxy</label></fieldset><fieldset><legend>FCM</legend><label>Android ID<input id="settings-android-id" type="password" required></label><label>Security token<input id="settings-security-token" type="password" required></label><label>FCM token<input id="settings-fcm-token" type="password" required></label><label>Expo push token<input id="settings-expo-push-token" type="password" required></label><label>Rust+ auth token<input id="settings-rustplus-auth-token" type="password" required></label></fieldset><label class="inline-check"><input id="show-settings-secrets" type="checkbox">Show secrets</label><div class="dialog-actions"><button type="button" class="secondary" id="cancel-settings">Cancel</button><button id="save-settings" type="submit">Save</button></div></form></dialog>
  <script src="/auth.js"></script><script src="/app.js"></script>
</body>
</html>
