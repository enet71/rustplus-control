<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | Rust+ Control</title><link rel="stylesheet" href="/styles.css"></head>
<body class="login-page">
  <main class="login-main">
    <p class="eyebrow">RUST+ COMPANION</p>
    <h1>Electrical control</h1>
    <p class="login-copy">Enter the access key configured for this Rust+ Control server.</p>
    <form id="login-form"><label>Access key<input id="access-token" type="password" autocomplete="current-password" required></label><button id="login" class="login-button" type="submit">Sign in</button></form>
    <p id="login-status" class="hint" role="status"></p>
  </main>
  <script src="/auth.js"></script>
  <script src="/login.js"></script>
</body>
</html>
